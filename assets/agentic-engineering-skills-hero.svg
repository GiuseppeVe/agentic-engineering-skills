<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Engineering Skills — a workflow worth sharing</title>
  <desc id="desc">A master orchestrator coordinates evidence, decisions, plans, implementation, testing and independent review. External actions remain under human authority.</desc>
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".6" fill="#302722" opacity=".09"/><circle cx="19" cy="17" r=".5" fill="#a15c4c" opacity=".1"/></pattern>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#fbf7f0"/><stop offset="1" stop-color="#efe6da"/></linearGradient>
    <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.ink{fill:#29211d}.muted{fill:#746960}.accent{fill:#984e40}.small{font-size:12px}.rule{stroke:#d8cbbd}.pill{fill:#fbf8f2;stroke:#d9ccbe}</style>
  </defs>
  <rect width="1200" height="450" rx="8" fill="url(#page)"/><rect width="1200" height="450" rx="8" fill="url(#grain)"/>
  <path d="M48 25H1152M48 425H1152" stroke="#c9baab"/>
  <g class="sans">
    <text x="52" y="61" class="accent" font-size="11" font-weight="700" letter-spacing="2.3">AGENTIC ENGINEERING SKILLS  /  PUBLIC EDITION</text>
    <text x="52" y="116" class="serif ink" font-size="45" letter-spacing="-1.5">Agentic Engineering Skills</text>
    <text x="54" y="151" class="serif ink" font-size="25">A workflow worth sharing.</text>
    <text x="54" y="184" class="muted" font-size="14">One orchestrator. Focused agents. Work that stays inspectable.</text>
    <text x="54" y="205" class="muted" font-size="14">Built for Codex and Claude Code, shaped by real engineering.</text>
    <path d="M907 53H1148" stroke="#984e40" stroke-width="2"/><circle cx="1148" cy="53" r="3.5" fill="#984e40"/>
    <text x="907" y="78" class="accent" font-size="10" font-weight="700" letter-spacing="1.6">A SHARED PRACTICE</text>
    <text x="907" y="103" class="muted small">Evidence before assumptions</text>
    <text x="907" y="122" class="muted small">Independent review by design</text>
    <text x="907" y="141" class="muted small">Human authority at the edges</text>
    <path d="M53 239H1147" class="rule"/>
    <text x="54" y="263" class="accent" font-size="10" font-weight="700" letter-spacing="1.7">TWO DISTINCT GRAPH WORKFLOWS</text>
    <rect x="54" y="280" width="1092" height="51" rx="6" class="pill"/>
    <rect x="54" y="280" width="241" height="51" rx="6" fill="#f0e3d7"/>
    <text x="74" y="311" class="accent" font-size="12" font-weight="700" letter-spacing=".8">RESEARCH &amp; DESIGN</text>
    <text x="321" y="312" class="ink" font-size="14" font-weight="700">Evidence</text><text x="432" y="312" class="accent" font-size="16">→</text>
    <text x="464" y="312" class="ink" font-size="14" font-weight="700">Decisions</text><text x="581" y="312" class="accent" font-size="16">→</text>
    <text x="613" y="312" class="ink" font-size="14" font-weight="700">Specifications</text><text x="758" y="312" class="accent" font-size="16">→</text>
    <text x="790" y="312" class="ink" font-size="14" font-weight="700">Plans &amp; handoff</text>
    <rect x="54" y="342" width="1092" height="51" rx="6" class="pill"/>
    <rect x="54" y="342" width="241" height="51" rx="6" fill="#984e40"/>
    <text x="74" y="373" fill="#fff9f2" font-size="12" font-weight="700" letter-spacing=".8">IMPLEMENTATION</text>
    <text x="321" y="374" class="ink" font-size="14" font-weight="700">Approved plans</text><text x="481" y="374" class="accent" font-size="16">→</text>
    <text x="513" y="374" class="ink" font-size="14" font-weight="700">Implement</text><text x="633" y="374" class="accent" font-size="16">→</text>
    <text x="665" y="374" class="ink" font-size="14" font-weight="700">Independent review</text><text x="858" y="374" class="accent" font-size="16">→</text>
    <text x="890" y="374" class="ink" font-size="14" font-weight="700">Integration</text>
  </g>
</svg>
