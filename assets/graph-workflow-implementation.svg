<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Implementation program graph workflow</title>
  <desc id="desc">A user starts an implementation master with approved plans and contracts. The master coordinates compatible plan threads in parallel. Each plan uses a sequential orchestrator to dispatch implementation and independent review in separate subordinate threads, repeating per task. Plan threads own their PR lifecycle, authorized merge and cleanup. The master verifies integration, updates the contract map and unblocks dependent plans. Visible threads require host support and authorization.</desc>
  <defs>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#fbf7f0"/><stop offset="1" stop-color="#eee5d9"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".6" fill="#302722" opacity=".07"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#984e40"/></marker>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#29211d}.serif{font-family:Georgia,"Times New Roman",serif}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.7px;fill:#984e40}.label{font-size:20px;font-weight:700}.detail{font-size:15px;fill:#706359}.small{font-size:13px;fill:#706359}.card{fill:#fffaf4;stroke:#d9cab9;stroke-width:1.4}.master{fill:#f6e8dc;stroke:#b77c69;stroke-width:1.5}.line{fill:none;stroke:#984e40;stroke-width:2;marker-end:url(#arrow)}.soft{fill:none;stroke:#c7b6a6;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="800" rx="10" fill="url(#page)"/><rect width="1200" height="800" rx="10" fill="url(#grain)"/>
  <path d="M48 25H1152M48 775H1152" stroke="#d4c5b5"/>
  <text x="50" y="59" class="eyebrow">GRAPH WORKFLOW  /  IMPLEMENTATION PROGRAMS</text>
  <text x="50" y="104" class="serif" font-size="34">One master. Parallel plans. Independent review.</text>
  <text x="50" y="132" class="detail">A coordinated program with ordered work inside each plan</text><text x="1149" y="58" class="eyebrow" text-anchor="end">02  /  02</text>

  <rect x="50" y="166" width="300" height="112" rx="8" class="card"/><text x="70" y="194" class="eyebrow">01  /  NEW CHAT</text><text x="70" y="225" class="label">You provide the program</text><text x="70" y="252" class="detail">Approved plans, contracts, scope</text>
  <path d="M350 222H397" class="line"/>
  <rect x="400" y="166" width="388" height="112" rx="8" class="master"/><text x="422" y="194" class="eyebrow">02  /  IMPLEMENTATION MASTER</text><text x="422" y="225" class="label">Coordinate the program</text><text x="422" y="252" class="detail">Dependencies, contracts, evidence</text>
  <path d="M788 222H835" class="soft"/>
  <rect x="838" y="166" width="312" height="112" rx="8" class="card"/><text x="858" y="194" class="eyebrow">CONTINUOUS</text><text x="858" y="225" class="label">Maintain the contract map</text><text x="858" y="252" class="detail">Track ownership and integration</text>

  <path d="M594 278V309" class="line"/><text x="50" y="321" class="eyebrow">03  /  COMPATIBLE PLAN THREADS</text><text x="374" y="321" class="small">Dispatch in parallel when dependencies and host capabilities allow</text>
  <rect x="50" y="340" width="1100" height="132" rx="8" fill="#e8ddd0" stroke="#c6ad9a" stroke-width="1.5"/>
  <text x="72" y="369" class="eyebrow">PLAN A</text><text x="72" y="397" font-size="17" font-weight="700">Sequential orchestrator</text><text x="72" y="422" class="small">Visible plan thread</text>
  <path d="M277 403H317" class="line"/><rect x="320" y="363" width="235" height="78" rx="7" class="card"/><text x="339" y="393" font-size="17" font-weight="700">Implement task</text><text x="339" y="419" class="small">Implementation subthread</text>
  <path d="M555 403H599" class="line"/><rect x="602" y="363" width="235" height="78" rx="7" class="card"/><text x="621" y="393" font-size="17" font-weight="700">Review task</text><text x="621" y="419" class="small">Independent subthread</text>
  <path d="M837 403H881" class="line"/><text x="894" y="394" font-size="15" font-weight="700">Repeat per task</text><text x="894" y="420" class="small">Then PR · authorized merge · cleanup</text>

  <rect x="50" y="489" width="1100" height="132" rx="8" fill="#e8ddd0" stroke="#c6ad9a" stroke-width="1.5"/>
  <text x="72" y="518" class="eyebrow">PLAN B  /  PARALLEL</text><text x="72" y="546" font-size="17" font-weight="700">Sequential orchestrator</text><text x="72" y="571" class="small">Visible plan thread</text>
  <path d="M277 552H317" class="line"/><rect x="320" y="512" width="235" height="78" rx="7" class="card"/><text x="339" y="542" font-size="17" font-weight="700">Implement task</text><text x="339" y="568" class="small">Implementation subthread</text>
  <path d="M555 552H599" class="line"/><rect x="602" y="512" width="235" height="78" rx="7" class="card"/><text x="621" y="542" font-size="17" font-weight="700">Review task</text><text x="621" y="568" class="small">Independent subthread</text>
  <path d="M837 552H881" class="line"/><text x="894" y="543" font-size="15" font-weight="700">Repeat per task</text><text x="894" y="569" class="small">Then PR · authorized merge · cleanup</text>

  <path d="M1150 405H1170V639H594V653" class="line"/><path d="M1150 555H1170" class="soft"/><rect x="212" y="657" width="776" height="77" rx="8" class="master"/><text x="234" y="685" class="eyebrow">04  /  MASTER VERIFIES INTEGRATION</text><text x="234" y="713" font-size="17" font-weight="700">Review evidence · update contracts · unblock dependent plans</text>
  <text x="50" y="758" class="small">Visible subordinate threads require host support and authorization. Missing required capabilities block the run.</text>
</svg>
