<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Implementation program graph</title><desc id="desc">A user starts an implementation master with approved plans and contract map. The master dispatches compatible plan threads in parallel. Each plan executes implementation and independent review in sequence. The master checks evidence and integration, updates the contract map and releases dependent plans.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b8075"/></marker><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#241f1c}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.2px;fill:#8a553d}.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#63584e}.box{fill:#fffaf3;stroke:#cdbfaf;stroke-width:1.5}.master{fill:#f8e9d9;stroke:#b88668;stroke-width:1.5}.line{fill:none;stroke:#8b8075;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="660" rx="12" fill="#f4efe8"/><text x="45" y="40" class="eyebrow">GRAPH WORKFLOW · IMPLEMENTATION PROGRAMS</text><text x="45" y="78" font-size="29" font-weight="700">One master, parallel plans, verified delivery</text>
<rect class="box" x="45" y="112" width="242" height="107" rx="9"/><text x="65" y="140" class="eyebrow">USER · NEW CHAT</text><text x="65" y="170" class="label">Approved program</text><text x="65" y="196" class="small">Plans, specs, contract map</text>
<path class="line" d="M287 165H340"/><rect class="master" x="342" y="112" width="312" height="107" rx="9"/><text x="362" y="140" class="eyebrow">IMPLEMENTATION MASTER</text><text x="362" y="170" class="label">Coordinate the graph</text><text x="362" y="196" class="small">Dependencies · authority · evidence</text>
<path class="line" d="M654 146H714V126H757"/><path class="line" d="M654 181H714V314H757"/>
<rect class="box" x="759" y="97" width="396" height="155" rx="9"/><text x="779" y="125" class="eyebrow">VISIBLE PLAN THREAD A</text><text x="779" y="153" class="label">Sequential orchestrator</text><text x="779" y="184" class="small">Implement task → independent review → repeat</text><text x="779" y="219" class="small">PR · authorized merge · cleanup</text>
<rect class="box" x="759" y="283" width="396" height="155" rx="9"/><text x="779" y="311" class="eyebrow">VISIBLE PLAN THREAD B · PARALLEL</text><text x="779" y="339" class="label">Sequential orchestrator</text><text x="779" y="370" class="small">Implement task → independent review → repeat</text><text x="779" y="405" class="small">PR · authorized merge · cleanup</text>
<text x="778" y="470" class="small">Compatible plans progress independently within host limits.</text>
<path class="line" d="M957 438V510H654"/><rect class="master" x="342" y="491" width="312" height="112" rx="9"/><text x="362" y="519" class="eyebrow">MASTER · CONTINUOUS</text><text x="362" y="549" class="label">Verify and update map</text><text x="362" y="576" class="small">Unblock dependencies after integration</text>
<path class="line" d="M342 547H287"/><rect class="box" x="45" y="491" width="242" height="112" rx="9"/><text x="65" y="519" class="eyebrow">RESULT</text><text x="65" y="549" class="label">Verified program</text><text x="65" y="576" class="small">Evidence · decisions · blockers</text>
</svg>