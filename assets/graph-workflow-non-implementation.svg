<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Research, analysis and design graph workflow</title>
  <desc id="desc">A user explicitly starts a master orchestrator. The master maintains a task graph, dispatches scoped investigation, delegates authorship separately and requests independent review when needed. It evaluates reports and revisits affected tasks or delivers decisions, specifications, plans or a handoff. Large design programs also maintain decision and shared-contract maps. Visible chats and persistent state depend on host support and authorization.</desc>
  <defs>
    <linearGradient id="page" x2="1" y2="1"><stop stop-color="#fbf7f0"/><stop offset="1" stop-color="#eee5d9"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".6" fill="#302722" opacity=".07"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#984e40"/></marker>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#29211d}.serif{font-family:Georgia,"Times New Roman",serif}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.7px;fill:#984e40}.label{font-size:20px;font-weight:700}.detail{font-size:15px;fill:#706359}.small{font-size:13px;fill:#706359}.card{fill:#fffaf4;stroke:#d9cab9;stroke-width:1.4}.master{fill:#f6e8dc;stroke:#b77c69;stroke-width:1.5}.line{fill:none;stroke:#984e40;stroke-width:2;marker-end:url(#arrow)}.soft{fill:none;stroke:#c7b6a6;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="850" rx="10" fill="url(#page)"/><rect width="1200" height="850" rx="10" fill="url(#grain)"/>
  <path d="M48 25H1152M48 825H1152" stroke="#d4c5b5"/>
  <text x="50" y="59" class="eyebrow">GRAPH WORKFLOW  /  RESEARCH &amp; DESIGN</text>
  <text x="50" y="104" class="serif" font-size="34">One master. A graph that evolves with the work.</text>
  <text x="51" y="132" class="detail">Research, analysis, audits, design and migration planning</text>
  <text x="1149" y="58" class="eyebrow" text-anchor="end">01  /  02</text>

  <rect x="50" y="166" width="283" height="112" rx="8" class="card"/>
  <text x="70" y="194" class="eyebrow">01  /  NEW CHAT</text><text x="70" y="225" class="label">You set the objective</text><text x="70" y="252" class="detail">Scope, constraints, authority</text>
  <path d="M333 222H379" class="line"/>
  <rect x="382" y="166" width="418" height="112" rx="8" class="master"/>
  <text x="404" y="194" class="eyebrow">02  /  MASTER ORCHESTRATOR</text><text x="404" y="225" class="label">Shape and maintain the graph</text><text x="404" y="252" class="detail">Tasks, dependencies, ownership and state</text>
  <path d="M800 222H846" class="soft"/>
  <rect x="849" y="166" width="301" height="112" rx="8" class="card"/>
  <text x="870" y="194" class="eyebrow">FOR LARGE DESIGN WORK</text><text x="870" y="225" class="label">Decision + contract maps</text><text x="870" y="252" class="detail">Shared ownership and conflicts</text>

  <path d="M591 278V320" class="line"/>
  <text x="50" y="338" class="eyebrow">03  /  DELEGATED WORK</text><text x="310" y="338" class="small">The master dispatches ready work within the authorized scope</text>
  <rect x="50" y="355" width="1100" height="173" rx="9" fill="#e8ddd0" stroke="#c6ad9a" stroke-width="1.5"/>
  <rect x="69" y="377" width="307" height="126" rx="7" class="card"/><text x="90" y="405" class="eyebrow">SCOPED DELEGATES</text><text x="90" y="435" class="label">Investigate &amp; analyze</text><text x="90" y="462" class="detail">Sources, alternatives, uncertainty</text><text x="90" y="484" class="small">Compatible work can run in parallel</text>
  <path d="M376 440H420" class="line"/>
  <rect x="423" y="377" width="307" height="126" rx="7" class="card"/><text x="444" y="405" class="eyebrow">A DIFFERENT DELEGATE</text><text x="444" y="435" class="label">Author the deliverable</text><text x="444" y="462" class="detail">Turn evidence into an artifact</text><text x="444" y="484" class="small">Separate from the investigator</text>
  <path d="M730 440H774" class="line"/>
  <rect x="777" y="377" width="353" height="126" rx="7" class="card"/><text x="798" y="405" class="eyebrow">WHEN NEEDED</text><text x="798" y="435" class="label">Independent review</text><text x="798" y="462" class="detail">Examine evidence and findings</text><text x="798" y="484" class="small">Reports include limits and uncertainty</text>

  <path d="M591 528V568" class="line"/>
  <rect x="294" y="572" width="594" height="104" rx="8" class="master"/>
  <text x="316" y="601" class="eyebrow">04  /  MASTER SYNTHESIZES</text><text x="316" y="632" class="label">Evaluate reports and update the graph</text><text x="316" y="657" class="detail">Resolve, revisit or add only the affected work</text>
  <path d="M294 623H30V300H400V278" class="soft" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="50" y="599" class="small">New evidence</text><text x="50" y="618" class="small">or decisions</text>
  <path d="M591 676V710" class="line"/>
  <rect x="294" y="714" width="594" height="72" rx="8" fill="#e8eee7" stroke="#b7c7b7"/>
  <text x="316" y="743" class="eyebrow">05  /  OUTCOME</text><text x="316" y="769" font-size="17" font-weight="700">Decisions · specifications · plans · implementation handoff</text>
  <text x="50" y="810" class="small">Visible chats and durable state require host support and authorization. The master does not implement code.</text>
</svg>
