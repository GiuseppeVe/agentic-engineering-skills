name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_HOME: ${{ runner.temp }}/codex-home
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.141.0
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.201
      - name: Install dependencies
        run: npm ci
      - name: Test contracts
        run: npm test
      - name: Verify pack
        run: npm run verify:pack
      - name: Verify pinned upstream sources
        run: npm run verify:upstream
      - name: Audit public release surface
        run: npm run audit:public
      - name: Add local Codex marketplace
        run: codex plugin marketplace add .
      - name: Install Codex plugin
        run: codex plugin add agentic-engineering-skills@agentic-engineering-skills
      - name: List available Codex plugins
        run: codex plugin list --available --json
      - name: Validate Claude Code plugin
        run: claude plugin validate .
