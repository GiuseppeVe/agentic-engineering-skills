name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test contracts
        run: npm test
      - name: Verify pack
        run: npm run verify:pack
      - name: Verify pinned upstream sources
        run: npm run verify:upstream
      - name: Audit public release surface
        run: npm run audit:public
      - name: Validate Codex plugin
        run: python "${CODEX_HOME:-$HOME/.codex}/skills/.system/plugin-creator/scripts/validate_plugin.py" plugins/agentic-engineering-skills
      - name: Validate Claude Code plugin
        run: claude plugin validate .
