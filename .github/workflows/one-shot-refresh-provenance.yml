name: One-shot provenance refresh

on:
  push:
    branches:
      - GiuseppeVe-patch-1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: GiuseppeVe-patch-1
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Refresh original skill provenance
        run: node scripts/stamp-originals.mjs

      - name: Stage provenance and remove one-shot workflow
        run: |
          git rm -f .github/workflows/one-shot-refresh-provenance.yml
          git add -A

      - name: Verify repository
        run: |
          npm test
          npm run verify:pack
          npm run verify:upstream
          npm run audit:public
          git diff --check --cached

      - name: Commit provenance refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh original skill provenance"
          git push origin HEAD:GiuseppeVe-patch-1
